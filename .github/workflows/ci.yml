name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m compileall dianalysis experiments train.py app.py

      - name: Ruff lint
        run: |
          ruff check dianalysis experiments train.py app.py

      - name: Mypy type check
        run: |
          pip install mypy
          mypy

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Train smoke test
        run: |
          python train.py

      - name: Model quality gate
        run: |
          python experiments/model_quality_gate.py
