[tool.ruff]
exclude = [".git", "__pycache__", "mlruns", "artifacts", ".venv_lint", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"experiments/model_quality_gate.py" = ["E402"]
"experiments/mlflow_missing_indicator_experiment.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
disable_error_code = ["import-untyped"]
exclude = "(^mlruns/|^artifacts/|\\.ipynb$)"
files = [
  "dianalysis",
  "experiments",
  "app.py",
  "train.py",
]
